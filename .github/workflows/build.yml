name: build

# Compila e prova TLX Control su Windows e macOS.
# Gli eseguibili/installer si scaricano dagli "Artifacts" della run.
# Con un tag v* crea anche una release in bozza con gli installer allegati.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formattazione
        run: cargo fmt --check
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Test del protocollo e del simulatore
        run: cargo test -p tlx-core -p tlx-sim
      - name: Test dell'applicazione (configurazione e piani di commutazione)
        run: cargo test -p tlx-control
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Controllo UI
        run: |
          npm ci --prefix ui
          npm --prefix ui run check
          npm --prefix ui run build

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            name: windows-x64
          - os: macos-latest
            args: '--target universal-apple-darwin'
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - name: Build Tauri
        shell: bash
        run: ./ui/node_modules/.bin/tauri build ${{ matrix.args }}
      - name: Simulatore da riga di comando
        shell: bash
        run: cargo build --release -p tlx-sim
      - name: Raccolta artefatti
        shell: bash
        run: |
          mkdir -p out
          find target -path '*/release/bundle/*' \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} out/ \;
          if [ -f target/release/tlx-control.exe ]; then cp target/release/tlx-control.exe out/TLX-Control-portable.exe; fi
          if [ -f target/release/tlx-sim.exe ]; then cp target/release/tlx-sim.exe out/; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: tlx-control-${{ matrix.name }}
          path: out/*
      - name: Release in bozza (solo su tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
